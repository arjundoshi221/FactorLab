services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: factorlab-clickhouse
    environment:
      CLICKHOUSE_DB: factorlab
      CLICKHOUSE_USER: factorlab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-factorlab_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  ingestion:
    build: .
    command: python scripts/factlab_india_clickhouse_5min.py --universe ${UPSTOX_UNIVERSE:-demo} --daemon
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: factorlab
      CLICKHOUSE_USERNAME: factorlab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-factorlab_dev}
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    profiles: ["ingestion"]

  political-ingestion:
    build: .
    command:
      - python
      - scripts/factlab_political_bootstrap.py
      - --ptr-limit
      - ${POLITICAL_PTR_LIMIT:-20}
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: factorlab
      CLICKHOUSE_USERNAME: factorlab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-factorlab_dev}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
    profiles: ["political"]

  api:
    build: .
    command: uvicorn factorlab.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: factorlab
      CLICKHOUSE_USERNAME: factorlab
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-factorlab_dev}
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  clickhouse_data:
