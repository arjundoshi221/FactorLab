name = "factorlab-upstox-auth"
main = "src/index.ts"
compatibility_date = "2026-07-26"
workers_dev = true
preview_urls = false

# Copy this file to wrangler.toml and replace IDs/Access values.
[[kv_namespaces]]
binding = "RUNTIME_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[secrets_store_secrets]]
binding = "UPSTOX_API_KEY"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "UPSTOX_API_KEY"

[[secrets_store_secrets]]
binding = "UPSTOX_API_SECRET"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "UPSTOX_API_SECRET"

[[secrets_store_secrets]]
binding = "SCHWAB_APP_KEY"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "SCHWAB_APP_KEY"

[[secrets_store_secrets]]
binding = "SCHWAB_APP_SECRET"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "SCHWAB_APP_SECRET"

[[secrets_store_secrets]]
binding = "TOKEN_ENCRYPTION_KEY"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "TOKEN_ENCRYPTION_KEY"

[[secrets_store_secrets]]
binding = "CLICKHOUSE_PASSWORD"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "CLICKHOUSE_PASSWORD"

[[secrets_store_secrets]]
binding = "CLICKHOUSE_PASSWORD_SHA256"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "CLICKHOUSE_PASSWORD_SHA256"

[[secrets_store_secrets]]
binding = "EODHD_API_KEY"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "EODHD_API_KEY"

[[secrets_store_secrets]]
binding = "FACTORLAB_API_KEY"
store_id = "REPLACE_WITH_SECRETS_STORE_ID"
secret_name = "FACTORLAB_API_KEY"

# Optional IB Gateway logins (docs/operations/ibkr-gateway-setup.md). Create the
# secrets in the store first, then uncomment; missing bindings render as null.
# [[secrets_store_secrets]]
# binding = "IBKR_PAPER_PASSWORD"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "IBKR_PAPER_PASSWORD"
#
# [[secrets_store_secrets]]
# binding = "IBKR_LIVE_PASSWORD"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "IBKR_LIVE_PASSWORD"
#
# [[secrets_store_secrets]]
# binding = "IBKR_VNC_PASSWORD"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "IBKR_VNC_PASSWORD"

# Optional IBKR Flex Web Service token (Portal -> Settings -> Flex Web Service);
# rendered for ingest-broker's broker.flex_activity. Missing binding renders as null.
# [[secrets_store_secrets]]
# binding = "IBKR_FLEX_TOKEN"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "IBKR_FLEX_TOKEN"

# Extra pooled Schwab accounts (one developer app each), optional. For account id
# `acct2`, create SCHWAB_APP_KEY_ACCT2 / SCHWAB_APP_SECRET_ACCT2 in the store, uncomment,
# and list the id in SCHWAB_ACCOUNTS (in both Workers). An id without bindings shows
# as "unconfigured".
# [[secrets_store_secrets]]
# binding = "SCHWAB_APP_KEY_ACCT2"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "SCHWAB_APP_KEY_ACCT2"
#
# [[secrets_store_secrets]]
# binding = "SCHWAB_APP_SECRET_ACCT2"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "SCHWAB_APP_SECRET_ACCT2"

[vars]
UPSTOX_REDIRECT_URL = "https://factorlab-upstox-oauth-callback.YOUR_SUBDOMAIN.workers.dev/oauth/callback"
SCHWAB_CALLBACK_URL = "https://factorlab-upstox-oauth-callback.YOUR_SUBDOMAIN.workers.dev/oauth/schwab/callback"
SCHWAB_ACCOUNTS = "primary"  # e.g. "primary,acct2"
CF_ACCESS_TEAM_DOMAIN = "YOUR_TEAM.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
