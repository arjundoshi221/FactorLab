[project]
name = "factorlab-storage"
version = "0.1.0"
description = "ClickHouse v2 writers and provider-blind dataset sinks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-clickhouse",
    "factorlab-ingest",
    "factorlab-calendars",
    "pandas>=2.1",
    "tzdata>=2024.1",   # zoneinfo keys on hosts without a system tz database
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-clickhouse = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-calendars = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
