[project]
name = "factorlab-calendars"
version = "0.1.0"
description = "Exchange calendars and trading-session windows."
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.5",
    "tzdata>=2024.1",   # zoneinfo keys on hosts without a system tz database
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
