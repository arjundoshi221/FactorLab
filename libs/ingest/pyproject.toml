[project]
name = "factorlab-ingest"
version = "0.1.0"
description = "Provider-agnostic ingestion SDK: contracts, datasets, registry, bindings, engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[tool.uv.sources]
factorlab-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
