[project]
name = "factorlab-clickhouse"
version = "0.1.0"
description = "ClickHouse settings, connection (optional SSH tunnel) and value conventions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "clickhouse-connect>=0.8",
]

[project.optional-dependencies]
ssh = ["paramiko>=3.4", "sshtunnel>=0.4"]

[tool.uv.sources]
factorlab-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
