[project]
name = "factorlab-orchestration"
version = "0.1.0"
description = "Engine CLI and daemon loop that run bindings through the SDK."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-runtime",
    "factorlab-calendars",
    "factorlab-ingest",
    "factorlab-storage",
    "tzdata>=2024.1",   # zoneinfo keys on hosts without a system tz database
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-runtime = { workspace = true }
factorlab-calendars = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-storage = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
