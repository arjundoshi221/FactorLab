[project]
name = "factorlab-testkit"
version = "0.1.0"
description = "Shared test support: provider conformance kit, fake ClickHouse, IBKR fakes. Dev only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-ingest",
    "factorlab-schema",
    "pytest>=8.0",
    "requests>=2.32.3",
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-schema = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
