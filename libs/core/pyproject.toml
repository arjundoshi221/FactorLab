[project]
name = "factorlab-core"
version = "0.1.0"
description = "Secrets, typed settings, paths and structured logging."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
