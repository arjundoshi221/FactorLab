[project]
name = "factorlab-schema"
version = "0.1.0"
description = "ClickHouse v2 schema waves, migrations, readiness checks and codegen."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-clickhouse",
    "clickhouse-connect>=0.8",
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-clickhouse = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
