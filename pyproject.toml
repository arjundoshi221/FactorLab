# FactorLab uv workspace root (virtual: it is never built or installed itself).
#
# Every library, provider and deployable component is its own distribution under
# libs/, providers/ and components/, with its own dependencies. One uv.lock pins
# third-party versions for all of them; each component's image installs only its
# own closure (`uv sync --package <member>`).
#
#   uv sync --all-packages          # development: every member, editable
#   uv run pytest                   # the whole suite
[project]
name = "factorlab-workspace"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "factorlab-testkit",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "httpx2>=2.0",          # FastAPI/Starlette TestClient (the successor of httpx)
    "python-dotenv>=1.0",   # scripts/read_clickhouse.py reads .env
    "packaging>=24",        # tools/verify_image.py evaluates dependency markers
    "pyyaml>=6.0",          # tools/components.py reads component.yaml
    "basedpyright>=1.30",   # type checking: strict on libs/, baseline elsewhere
]
research = [
    "duckdb>=1.0",
    "polars>=1.0",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["libs/*", "providers/*", "components/*"]
exclude = ["components/web"]   # npm project, built by its own Dockerfile stage

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-runtime = { workspace = true }
factorlab-calendars = { workspace = true }
factorlab-clickhouse = { workspace = true }
factorlab-schema = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-storage = { workspace = true }
factorlab-orchestration = { workspace = true }
factorlab-testkit = { workspace = true }
factorlab-provider-upstox = { workspace = true }
factorlab-provider-schwab = { workspace = true }
factorlab-provider-eodhd = { workspace = true }
factorlab-provider-github-csv = { workspace = true }
factorlab-provider-ibkr = { workspace = true }
factorlab-provider-house-clerk = { workspace = true }
factorlab-provider-congress-legislators = { workspace = true }
factorlab-provider-edgar = { workspace = true }
factorlab-component-api = { workspace = true }
factorlab-component-ingest-india = { workspace = true }
factorlab-component-ingest-us = { workspace = true }
factorlab-component-ingest-political = { workspace = true }
factorlab-component-ingest-broker = { workspace = true }
factorlab-component-secrets-agent = { workspace = true }
factorlab-component-schema-migrator = { workspace = true }

[tool.pytest.ini_options]
# Tests live with the member they test (libs/*/tests, providers/*/tests,
# components/*/tests); tests/ holds the cross-cutting ones. importlib mode lets
# members share test file names without __init__.py packages.
testpaths = ["libs", "providers", "components", "tests"]
addopts = ["--import-mode=importlib"]
norecursedirs = ["node_modules", "dist", ".venv", ".tmp", "src"]

[tool.basedpyright]
# `uv run basedpyright` in CI. Libraries are strict; everything else is standard.
# Errors that existed when this was introduced are recorded in
# .basedpyright/baseline.json and shrink as code is fixed; any new error fails CI.
# After fixing old ones: `uv run basedpyright --writebaseline`.
pythonVersion = "3.12"
pythonPlatform = "Linux"   # production; keeps Windows and CI results identical
include = ["libs", "providers", "components", "tools", "tests", "scripts", "deploy"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", ".tmp", "components/web", "cloudflare"]
typeCheckingMode = "standard"
strict = ["libs/*/src"]
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "deploy", pythonVersion = "3.10" },   # host tools run on the VPS's python3
    { root = "." },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/*/src", "providers/*/src", "components/*/src"]
extend-exclude = ["components/web", "cloudflare"]

[tool.ruff.per-file-target-version]
# Host tools run on the VPS's system python3, which may be older than the images'.
"deploy/**/*.py" = "py310"

[tool.ruff.lint]
# Explicit, so a ruff upgrade never changes what CI enforces. Correctness first
# (pyflakes, bugbear, pylint errors and warnings, timezone-aware datetimes, blind
# excepts), then modernisation, simplification and import order, plus a curated
# slice of flake8-bandit. Line length belongs to `ruff format` (E501 is ignored).
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PERF", "FURB", "DTZ",
    "LOG", "G", "YTT", "EXE", "ISC", "BLE", "ASYNC", "PGH", "FLY", "T10", "PLE", "PLW",
    # bandit: exec/eval, shell=True, requests without a timeout or TLS verification,
    # unsafe YAML/pickle, weak hashes, 0.0.0.0 binds, world-writable files, Jinja autoescape
    "S102", "S103", "S104", "S113", "S301", "S307", "S324", "S501", "S506", "S602",
    "S604", "S605", "S701",
]
ignore = [
    "E501",     # the formatter owns line length
    "UP042",    # (str, Enum) -> StrEnum changes str() of members; stored values rely on it
    "SIM105",   # try/except/pass reads as clearly as contextlib.suppress
    "PLW2901",  # rebinding a loop variable (line = line.strip()) is idiomatic here
    "PERF401",  # an explicit loop is often clearer than a comprehension
]
allowed-confusables = ["–"]   # EN DASH in user-facing text

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["DTZ"]                         # tests build naive datetimes on purpose
"**/legacy/**" = ["BLE001", "PLW0603", "DTZ"]   # frozen until its cutover deletes it
"libs/runtime/src/factorlab/runtime/notify/*.py" = ["BLE001"]  # notifications are best-effort

[tool.ruff.lint.isort]
known-first-party = ["factorlab"]

[tool.ruff.format]
# Code samples in docs keep their hand alignment; only real code is formatted.
exclude = ["**/*.md"]
