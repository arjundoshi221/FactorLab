[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorlab"
version = "0.1.0"
description = "Global fundamental equity research platform"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",     # CVE-2024-35195 (cert-verify bypass) fixed in 2.32.0
    "defusedxml>=0.7.1",    # billion-laughs / XXE protection for House Clerk year-XML
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "exchange-calendars>=4.5",
    "clickhouse-connect>=0.8",
    "pdfplumber>=0.11",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "ib_async>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx>=0.27",          # FastAPI TestClient
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
research = [
    "duckdb>=1.0",
    "polars>=1.0",
]
ops = [
    "paramiko>=3.4",
    "sshtunnel>=0.4",
]
notify = [
    "pywin32>=308; platform_system == 'Windows'",  # Outlook COM backend (Windows-only)
]

[tool.hatch.build.targets.wheel]
packages = ["src/factorlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
