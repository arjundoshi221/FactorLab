name: Branch political trial release

# A tagged, CI-green commit on the dedicated branch installs a new ingest-political
# image (the daily cron runs it) and applies the identity repair
# (docs/operations/identity-repair.md). Main and normal release tags are untouched.
on:
  push:
    tags: ["political-trial/*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: factorlab-political-trial
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
      test_id: ${{ steps.check.outputs.test_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check immutable tag, branch tip, and CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^political-trial/([0-9a-f]{12})$ ]] || { echo "Invalid political trial tag" >&2; exit 1; }
          short=${BASH_REMATCH[1]}
          commit=$(git rev-parse HEAD)
          [[ ${commit:0:12} == "$short" ]] || { echo "Tag does not name its commit" >&2; exit 1; }
          git fetch --no-tags origin restructure/deploy-market-data-ui
          [[ $(git rev-parse FETCH_HEAD) == "$commit" ]] || {
            echo "Tag must point to the dedicated branch tip" >&2; exit 1; }
          runs=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$commit&per_page=30")
          jq -e --arg sha "$commit" '
            any(.workflow_runs[]; .name == "CI" and .head_sha == $sha
              and .status == "completed" and .conclusion == "success")
          ' <<<"$runs" >/dev/null || { echo "CI is not green for $commit" >&2; exit 1; }
          {
            echo "commit=$commit"
            echo "version=0.0.0-trial.$short"
            echo "test_id=political-$short"
          } >> "$GITHUB_OUTPUT"

  political-image:
    needs: authorize
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_release-image.yml
    with:
      unit: ingest-political
      version: ${{ needs.authorize.outputs.version }}
      image: ghcr.io/arjundoshi221/factorlab-ingest-political
      dockerfile: components/ingest-political/Dockerfile
      commit: ${{ needs.authorize.outputs.commit }}

  deploy:
    needs: [authorize, political-image]
    runs-on: ubuntu-latest
    environment: production
    env:
      COMMIT: ${{ needs.authorize.outputs.commit }}
      TEST_ID: ${{ needs.authorize.outputs.test_id }}
      IMAGE: ghcr.io/arjundoshi221/factorlab-ingest-political@${{ needs.political-image.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}
      - name: Transfer the reviewed trial runner
        run: |
          set -euo pipefail
          [[ $IMAGE =~ ^ghcr\.io/arjundoshi221/factorlab-ingest-political@sha256:[0-9a-f]{64}$ ]]
          run_dir="/tmp/factorlab-$TEST_ID-${{ github.run_id }}"
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "install -d -m 0700 '$run_dir'"
          scp -i ~/.ssh/factorlab_deploy -o BatchMode=yes \
            deploy/testing/political_test.py deploy/testing/ingestion_test.py \
            "$VPS_USER@$VPS_HOST:$run_dir/"
      - name: Install the image and apply the identity repair
        id: trial
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "sudo env PYTHONDONTWRITEBYTECODE=1 python3 '$RUN_DIR/political_test.py' apply '$TEST_ID' --commit '$COMMIT' --image '$IMAGE' --max-retire 200" \
            | tee trial.log
          status=${PIPESTATUS[0]}
          set -e
          for key in VERIFICATION ROLLBACK RETIRE RERESOLVE; do
            value=$(sed -n "s/^FACTORLAB_RESULT_${key}=//p" trial.log | tail -1)
            echo "$(tr '[:upper:]' '[:lower:]' <<<"$key")=${value:-not-reported}" >> "$GITHUB_OUTPUT"
          done
          exit "$status"
      - name: Record the exact trial result
        if: always()
        env:
          VERIFICATION: ${{ steps.trial.outputs.verification }}
          ROLLBACK: ${{ steps.trial.outputs.rollback }}
          RETIRE: ${{ steps.trial.outputs.retire }}
          RERESOLVE: ${{ steps.trial.outputs.reresolve }}
        run: |
          {
            echo "## Political trial $TEST_ID"
            echo "- Commit: \`$COMMIT\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Retire duplicate listings: \`${RETIRE:-not-run}\`"
            echo "- Re-resolve political trades: \`${RERESOLVE:-not-run}\`"
            echo "- Verification: \`${VERIFICATION:-not-run}\`"
            echo "- Recovery: \`${ROLLBACK:-not-reported}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the temporary runner transfer
        if: always()
        run: |
          if [[ -n ${RUN_DIR:-} ]]; then
            ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "sudo rm -rf -- '$RUN_DIR'" || true
          fi
