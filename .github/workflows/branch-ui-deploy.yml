name: Branch UI trial release

# Updates only the running api-candidate and web services (the public hub), with
# verification and automatic restore of the preceding images (deploy/testing/ui_test.py).
#
# - Automatic: every push to main that changes what the API or web image is built from
#   deploys once CI is green for that commit. A commit whose CI fails or is superseded
#   (cancelled by a newer push) is skipped; the newer push deploys instead.
# - Manual: ./deploy/release-ui-trial.ps1 pushes ui-trial/<sha12> for a CI-green commit
#   on main (for example to redeploy one the path filter skipped).
# Path filters apply only to branch pushes; tag pushes always run.
on:
  push:
    branches: [main]
    tags: ["ui-trial/*"]
    paths:
      - "components/web/**"
      - "components/api/**"
      - "libs/**"
      - "configs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/testing/ui_test.py"
      - ".github/workflows/branch-ui-deploy.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: factorlab-ui-trial
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
      test_id: ${{ steps.check.outputs.test_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commit is on main, CI is green, and it is not yet deployed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          short=${commit:0:12}
          skip() { echo "Skipping: $1"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
          ci_state() {
            gh api "repos/$REPOSITORY/actions/runs?head_sha=$commit&per_page=50" | jq -r '
              [.workflow_runs[] | select(.name == "CI" and .event == "push")]
              | sort_by(.created_at) | last | if . == null then "none"
                else "\(.status)/\(.conclusion // "")" end'
          }
          if [[ $REF_TYPE == tag ]]; then
            [[ $TAG =~ ^ui-trial/([0-9a-f]{12})$ ]] || { echo "Invalid UI trial tag" >&2; exit 1; }
            [[ ${BASH_REMATCH[1]} == "$short" ]] || { echo "Tag does not name its commit" >&2; exit 1; }
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" FETCH_HEAD || {
            echo "$commit is not on main" >&2; exit 1; }
          # Wait for CI on this commit (push-to-main runs start alongside it).
          for _ in $(seq 1 100); do
            state=$(ci_state)
            case $state in
              completed/success) break ;;
              completed/cancelled) skip "CI for $short was superseded by a newer push" ;;
              completed/*)
                if [[ $REF_TYPE == tag ]]; then echo "CI is not green for $commit" >&2; exit 1; fi
                skip "CI failed for $short ($state)" ;;
            esac
            sleep 30
          done
          [[ $state == completed/success ]] || { echo "Timed out waiting for CI ($state)" >&2; exit 1; }
          # One trial per commit: ui_test.py refuses a repeated test ID.
          others=$(gh api "repos/$REPOSITORY/actions/workflows/branch-ui-deploy.yml/runs?head_sha=$commit&per_page=50" \
            | jq --argjson me "$RUN_ID" '[.workflow_runs[] | select(.id != $me and .id < $me
                and (.conclusion == "success" or .status != "completed"))] | length')
          [[ $others == 0 ]] || skip "$short already has a UI deploy run"
          {
            echo "deploy=true"
            echo "commit=$commit"
            echo "version=0.0.0-trial.$short"
            echo "test_id=ui-$short"
          } >> "$GITHUB_OUTPUT"

  api-image:
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_release-image.yml
    with:
      unit: api
      version: ${{ needs.authorize.outputs.version }}
      image: ghcr.io/arjundoshi221/factorlab-api
      dockerfile: components/api/Dockerfile
      commit: ${{ needs.authorize.outputs.commit }}

  web-image:
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_release-image.yml
    with:
      unit: web
      version: ${{ needs.authorize.outputs.version }}
      image: ghcr.io/arjundoshi221/factorlab-web
      dockerfile: components/web/Dockerfile
      commit: ${{ needs.authorize.outputs.commit }}

  deploy:
    needs: [authorize, api-image, web-image]
    runs-on: ubuntu-latest
    environment: production
    env:
      COMMIT: ${{ needs.authorize.outputs.commit }}
      TEST_ID: ${{ needs.authorize.outputs.test_id }}
      API_IMAGE: ghcr.io/arjundoshi221/factorlab-api@${{ needs.api-image.outputs.digest }}
      WEB_IMAGE: ghcr.io/arjundoshi221/factorlab-web@${{ needs.web-image.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}
      - name: Transfer the reviewed trial runner
        run: |
          set -euo pipefail
          [[ $API_IMAGE =~ ^ghcr\.io/arjundoshi221/factorlab-api@sha256:[0-9a-f]{64}$ ]]
          [[ $WEB_IMAGE =~ ^ghcr\.io/arjundoshi221/factorlab-web@sha256:[0-9a-f]{64}$ ]]
          run_dir="/tmp/factorlab-$TEST_ID-${{ github.run_id }}"
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "install -d -m 0700 '$run_dir'"
          scp -i ~/.ssh/factorlab_deploy -o BatchMode=yes \
            deploy/testing/ui_test.py deploy/testing/ingestion_test.py \
            "$VPS_USER@$VPS_HOST:$run_dir/"
      - name: Apply and verify the API and web trial
        id: trial
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "sudo env PYTHONDONTWRITEBYTECODE=1 python3 '$RUN_DIR/ui_test.py' apply '$TEST_ID' --commit '$COMMIT' --api-image '$API_IMAGE' --web-image '$WEB_IMAGE'" \
            | tee trial.log
          status=${PIPESTATUS[0]}
          set -e
          for key in VERIFICATION ROLLBACK; do
            value=$(sed -n "s/^FACTORLAB_RESULT_${key}=//p" trial.log | tail -1)
            echo "$(tr '[:upper:]' '[:lower:]' <<<"$key")=${value:-not-reported}" >> "$GITHUB_OUTPUT"
          done
          exit "$status"
      - name: Record the exact trial result
        if: always()
        env:
          VERIFICATION: ${{ steps.trial.outputs.verification }}
          ROLLBACK: ${{ steps.trial.outputs.rollback }}
        run: |
          {
            echo "## UI trial $TEST_ID"
            echo "- Commit: \`$COMMIT\`"
            echo "- API image: \`$API_IMAGE\`"
            echo "- Web image: \`$WEB_IMAGE\`"
            echo "- Verification: \`${VERIFICATION:-not-run}\`"
            echo "- Recovery: \`${ROLLBACK:-not-reported}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the temporary runner transfer
        if: always()
        run: |
          if [[ -n ${RUN_DIR:-} ]]; then
            ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "sudo rm -rf -- '$RUN_DIR'" || true
          fi
