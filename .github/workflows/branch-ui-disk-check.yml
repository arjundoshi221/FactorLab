name: Branch UI disk preflight

on:
  push:
    branches: [restructure/deploy-market-data-ui]
    paths: [.github/workflows/branch-ui-disk-check.yml]

permissions:
  contents: read

jobs:
  host-disk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}
      - name: Read filesystem and Docker capacity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            df -h / /opt /tmp /var/lib/docker
            df -i / /opt /tmp /var/lib/docker
            sudo docker system df
            sudo du -xsh /opt/factorlab/deployment-tests /var/lib/docker /var/log/factorlab /tmp 2>/dev/null
            sudo du -xsh /var/* /opt/* 2>/dev/null | sort -h | tail -25
            sudo python3 /opt/factorlab/deploy/scripts/prune-images.py --dry-run
            sudo docker image ls --filter dangling=true --format "{{.ID}} {{.Size}}"
            for id in $(sudo docker image ls --filter dangling=true --no-trunc --quiet); do
              refs=$(sudo grep -R -l -F "$id" /opt/factorlab/deployment-tests /opt/factorlab/deploy/compose.production.yml 2>/dev/null | wc -l)
              containers=$(sudo docker ps --all --filter "ancestor=$id" --quiet | wc -l)
              echo "dangling=$id backup_refs=$refs containers=$containers"
              sudo docker image inspect "$id" --format "created={{.Created}} tags={{.RepoTags}} labels={{.Config.Labels}}"
            done
          '
