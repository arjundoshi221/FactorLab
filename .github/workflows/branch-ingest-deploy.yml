name: Branch ingestion trial release

# A tagged, CI-green commit on the dedicated branch replaces (or adds) the ingestion
# services of one scope through deploy/testing/ingest_trial.py: plan, apply, verify,
# with the preceding model restored on a failed startup. Tag ingest-trial/<scope>/<sha12>,
# scope one of futures-us or indexes-us (each adds only that service), ingest-us,
# ingest-india, ingest-broker.
# Main and normal release tags are untouched; schema migrations are never run here.
on:
  push:
    tags: ["ingest-trial/*/*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: factorlab-ingest-trial
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
      test_id: ${{ steps.check.outputs.test_id }}
      scope: ${{ steps.check.outputs.scope }}
      unit: ${{ steps.check.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check immutable tag, scope, branch tip, and CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^ingest-trial/(futures-us|indexes-us|ingest-us|ingest-india|ingest-broker)/([0-9a-f]{12})$ ]] || {
            echo "Invalid ingestion trial tag" >&2; exit 1; }
          scope=${BASH_REMATCH[1]}
          short=${BASH_REMATCH[2]}
          case $scope in futures-us|indexes-us) unit=ingest-us ;; *) unit=$scope ;; esac
          commit=$(git rev-parse HEAD)
          [[ ${commit:0:12} == "$short" ]] || { echo "Tag does not name its commit" >&2; exit 1; }
          git fetch --no-tags origin restructure/deploy-market-data-ui
          [[ $(git rev-parse FETCH_HEAD) == "$commit" ]] || {
            echo "Tag must point to the dedicated branch tip" >&2; exit 1; }
          runs=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$commit&per_page=30")
          jq -e --arg sha "$commit" '
            any(.workflow_runs[]; .name == "CI" and .head_sha == $sha
              and .status == "completed" and .conclusion == "success")
          ' <<<"$runs" >/dev/null || { echo "CI is not green for $commit" >&2; exit 1; }
          {
            echo "commit=$commit"
            echo "version=0.0.0-trial.$short"
            echo "test_id=$(date -u +%Y%m%d)-$short"
            echo "scope=$scope"
            echo "unit=$unit"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: authorize
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_release-image.yml
    with:
      unit: ${{ needs.authorize.outputs.unit }}
      version: ${{ needs.authorize.outputs.version }}
      image: ghcr.io/arjundoshi221/factorlab-${{ needs.authorize.outputs.unit }}
      dockerfile: components/${{ needs.authorize.outputs.unit }}/Dockerfile
      commit: ${{ needs.authorize.outputs.commit }}

  deploy:
    needs: [authorize, image]
    runs-on: ubuntu-latest
    environment: production
    env:
      COMMIT: ${{ needs.authorize.outputs.commit }}
      TEST_ID: ${{ needs.authorize.outputs.test_id }}
      SCOPE: ${{ needs.authorize.outputs.scope }}
      IMAGE: ghcr.io/arjundoshi221/factorlab-${{ needs.authorize.outputs.unit }}@${{ needs.image.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          host-key: ${{ secrets.VPS_SSH_HOST_KEY }}
      - name: Transfer the reviewed trial runner and candidate model
        run: |
          set -euo pipefail
          [[ $IMAGE =~ ^ghcr\.io/arjundoshi221/factorlab-ingest-(us|india|broker)@sha256:[0-9a-f]{64}$ ]]
          run_dir="/tmp/factorlab-ingest-$TEST_ID-${{ github.run_id }}"
          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "install -d -m 0700 '$run_dir'"
          scp -i ~/.ssh/factorlab_deploy -o BatchMode=yes \
            deploy/testing/ingest_trial.py deploy/testing/ingestion_test.py \
            deploy/compose.production.yml "$VPS_USER@$VPS_HOST:$run_dir/"
      - name: Plan, apply and verify the scope
        id: trial
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" \
            "sudo env PYTHONDONTWRITEBYTECODE=1 python3 '$RUN_DIR/ingest_trial.py' apply '$TEST_ID' --scope '$SCOPE' --commit '$COMMIT' --image '$IMAGE' --model '$RUN_DIR/compose.production.yml'" \
            | tee trial.log
          status=${PIPESTATUS[0]}
          set -e
          for key in PLAN VERIFICATION ROLLBACK SERVICES; do
            value=$(sed -n "s/^FACTORLAB_RESULT_${key}=//p" trial.log | tail -1)
            echo "$(tr '[:upper:]' '[:lower:]' <<<"$key")=${value:-not-reported}" >> "$GITHUB_OUTPUT"
          done
          exit "$status"
      - name: Record the exact trial result
        if: always()
        env:
          PLAN: ${{ steps.trial.outputs.plan }}
          VERIFICATION: ${{ steps.trial.outputs.verification }}
          ROLLBACK: ${{ steps.trial.outputs.rollback }}
          SERVICES: ${{ steps.trial.outputs.services }}
        run: |
          {
            echo "## Ingestion trial $TEST_ID ($SCOPE)"
            echo "- Commit: \`$COMMIT\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Plan: \`${PLAN:-not-run}\`"
            echo "- Verification: \`${VERIFICATION:-not-run}\`"
            echo "- Recovery: \`${ROLLBACK:-not-reported}\`"
            echo "- Running: \`${SERVICES:-none}\`"
            echo "- Restore: \`sudo python3 /opt/factorlab/deployment-tests/$TEST_ID/ingest_trial.py restore $TEST_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the temporary runner transfer
        if: always()
        run: |
          if [[ -n ${RUN_DIR:-} ]]; then
            ssh -i ~/.ssh/factorlab_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "sudo rm -rf -- '$RUN_DIR'" || true
          fi
