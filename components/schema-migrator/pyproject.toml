[project]
name = "factorlab-component-schema-migrator"
version = "0.1.0"
description = "One-shot ClickHouse v2 readiness gate, write verification and reviewed migrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-runtime",
    "factorlab-schema",
]

[project.scripts]
factorlab-db = "factorlab.components.schema_migrator.cli:main"

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-runtime = { workspace = true }
factorlab-schema = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
