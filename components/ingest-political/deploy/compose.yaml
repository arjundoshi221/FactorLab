# Compose fragment for the ingest-political component, merged with deploy/compose.base.yml.
# A one-shot job (`jobs` profile) started by host cron at 02:15 UTC.
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5", compress: "true"}

services:
  ingest-political:
    image: ${FACTORLAB_INGEST_POLITICAL_IMAGE:-${FACTORLAB_IMAGE:-factorlab:latest}}
    entrypoint: ["factorlab-ingest-political"]
    command: ["bootstrap", "--ptr-limit", "${POLITICAL_PTR_LIMIT:-20}"]
    restart: "no"
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USERNAME: factorlab
      FACTORLAB_PERSIST_SECRETS: "false"
      FACTORLAB_SECRETS_DIR: /run/secrets/app
      FACTORLAB_COMPONENT: ingest-political
      FACTORLAB_SERVICE: ingest-political
      FACTORLAB_LOG_DIR: /var/log/factorlab/ingest-political
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - political_runtime:/run/secrets/app:ro
      - /var/log/factorlab/ingest-political:/var/log/factorlab/ingest-political
    profiles: [jobs]
