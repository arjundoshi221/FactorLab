[project]
name = "factorlab-component-secrets-agent"
version = "0.1.0"
description = "Renders Cloudflare-held runtime secrets into tmpfs volumes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "requests>=2.32.3",
]

[tool.uv.sources]
factorlab-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
