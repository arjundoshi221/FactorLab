[project]
name = "factorlab-component-ingest-us"
version = "0.1.0"
description = "US universe, daily and 1-min bars into ClickHouse v2."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-runtime",
    "factorlab-calendars",
    "factorlab-ingest",
    "factorlab-storage",
    "factorlab-orchestration",
    "factorlab-provider-schwab",
    "factorlab-provider-eodhd",
    "factorlab-provider-github-csv",
    "factorlab-provider-edgar",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "requests>=2.32.3",
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-runtime = { workspace = true }
factorlab-calendars = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-storage = { workspace = true }
factorlab-orchestration = { workspace = true }
factorlab-provider-schwab = { workspace = true }
factorlab-provider-eodhd = { workspace = true }
factorlab-provider-github-csv = { workspace = true }
factorlab-provider-edgar = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
