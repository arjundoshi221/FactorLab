# Compose fragment for the ingest-us component (two services, one image), merged with
# deploy/compose.base.yml. FACTORLAB_US_IMAGE is the monolith-era pin kept for the bridge.
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5", compress: "true"}

services:
  universe-us:
    image: ${FACTORLAB_INGEST_US_IMAGE:-${FACTORLAB_US_IMAGE:-${FACTORLAB_IMAGE:-factorlab:latest}}}
    entrypoint: ["factorlab-ingest-us"]
    command: ["universe", "--config", "/app/config/us-universe.yaml", "--daemon"]
    restart: unless-stopped
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    mem_limit: 512m
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USERNAME: factorlab
      FACTORLAB_PERSIST_SECRETS: "false"
      FACTORLAB_SECRETS_DIR: /run/secrets/app
      FACTORLAB_COMPONENT: ingest-us
      FACTORLAB_SERVICE: universe-us
      FACTORLAB_LOG_DIR: /var/log/factorlab/ingest-us
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - us_runtime:/run/secrets/app:ro
      - ${FACTORLAB_US_UNIVERSE_CONFIG:-/etc/factorlab/us-universe.yaml}:/app/config/us-universe.yaml:ro
      - /var/log/factorlab/ingest-us:/var/log/factorlab/ingest-us

  ingest-us:
    image: ${FACTORLAB_INGEST_US_IMAGE:-${FACTORLAB_US_IMAGE:-${FACTORLAB_IMAGE:-factorlab:latest}}}
    entrypoint: ["factorlab-ingest-us"]
    command: ["daemon", "--universe", "us_listed_equities", "--daemon"]
    restart: unless-stopped
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    mem_limit: 1g
    stop_grace_period: 120s
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USERNAME: factorlab
      FACTORLAB_PERSIST_SECRETS: "false"
      FACTORLAB_SECRETS_DIR: /run/secrets/app
      FACTORLAB_COMPONENT: ingest-us
      FACTORLAB_SERVICE: ingest-us
      FACTORLAB_LOG_DIR: /var/log/factorlab/ingest-us
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - us_runtime:/run/secrets/app:ro
      - /var/lib/factorlab/app-data:/app/data
      - /var/log/factorlab/ingest-us:/var/log/factorlab/ingest-us
