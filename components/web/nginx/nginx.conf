# factorlab-web: static hub UI on :8080 (non-root nginx; pid and temp files under /tmp).
# Cloudflare Tunnel routes /hub/api, /api, /health, /docs and /openapi.json to the API
# container and everything else here. Cloudflare Access guards the whole hostname.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Same record shape as the Python components' JSON logs; $uri drops query strings.
    log_format factorlab escape=json
        '{"ts":"$time_iso8601","level":"INFO","component":"web","service":"web",'
        '"logger":"nginx.access","msg":"$request_method $uri $status",'
        '"method":"$request_method","route":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_ms":$request_time,"request_id":"$http_cf_ray"}';
    access_log /dev/stdout factorlab;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # API paths belong to the API container; never answer them with the SPA.
        location ~ ^/(hub/api|api)/ {
            return 404;
        }
        location ~ ^/(health|docs|redoc|openapi\.json)$ {
            return 404;
        }

        # Hashed build assets never change.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Client-side routes fall back to the app shell, which is never cached.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;
            try_files $uri /index.html;
        }
    }
}
