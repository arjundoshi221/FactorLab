[project]
name = "factorlab-component-api"
version = "0.1.0"
description = "FastAPI read API and hub backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-clickhouse",
    "factorlab-schema",
    "factorlab-calendars",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "exchange-calendars>=4.5",
    "tzdata>=2024.1",   # zoneinfo keys on hosts without a system tz database
]

[project.scripts]
factorlab-api = "factorlab.components.api.__main__:main"

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-clickhouse = { workspace = true }
factorlab-schema = { workspace = true }
factorlab-calendars = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
