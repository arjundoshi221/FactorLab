# Compose fragment for the monitor component, merged with deploy/compose.base.yml.
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5", compress: "true"}

services:
  monitor:
    image: ${FACTORLAB_MONITOR_IMAGE:-ghcr.io/arjundoshi221/factorlab-monitor:unreleased}
    entrypoint: ["factorlab-monitor"]
    command: []
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    expose: ["9125/udp"]
    healthcheck:
      test: ["CMD", "factorlab-healthcheck", "http", "http://127.0.0.1:9126/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USERNAME: monitor
      FACTORLAB_PERSIST_SECRETS: "false"
      FACTORLAB_SECRETS_DIR: /run/secrets/app
      FACTORLAB_COMPONENT: monitor
      FACTORLAB_SERVICE: monitor
      FACTORLAB_LOG_DIR: /var/log/factorlab/monitor
      FACTORLAB_LOG_ROOT: /var/log/factorlab/monitor
      FACTORLAB_NOTIFY_BACKEND: ${FACTORLAB_NOTIFY_BACKEND:-jsonl}
      FACTORLAB_NOTIFY_TO: ${FACTORLAB_NOTIFY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FACTORLAB_NOTIFY_URL: ${FACTORLAB_NOTIFY_URL:-}
      FACTORLAB_NOTIFY_PIN: ${FACTORLAB_NOTIFY_PIN:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - monitor_runtime:/run/secrets/app:ro
      - ${FACTORLAB_MONITOR_REGISTRY:-/etc/factorlab/monitor-services.yaml}:/app/monitor-services.yaml:ro
      - /var/log/factorlab/monitor:/var/log/factorlab/monitor
    mem_limit: 256m
