# Compose fragment for the ingest-india component, merged with deploy/compose.base.yml.
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5", compress: "true"}

services:
  ingest-india:
    image: ${FACTORLAB_INGEST_INDIA_IMAGE:-${FACTORLAB_IMAGE:-factorlab:latest}}
    entrypoint: ["factorlab-ingest-india"]
    command: ["daemon", "--universe", "${UPSTOX_UNIVERSE:-full_nse_eq}", "--daemon"]
    restart: unless-stopped
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USERNAME: factorlab
      FACTORLAB_PERSIST_SECRETS: "false"
      FACTORLAB_SECRETS_DIR: /run/secrets/app
      FACTORLAB_COMPONENT: ingest-india
      FACTORLAB_SERVICE: ingest-india
      FACTORLAB_LOG_DIR: /var/log/factorlab/ingest-india
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - india_runtime:/run/secrets/app:ro
      - /var/lib/factorlab/app-data:/app/data
      - /var/log/factorlab/ingest-india:/var/log/factorlab/ingest-india
    mem_limit: 1500m
