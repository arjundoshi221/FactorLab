[project]
name = "factorlab-component-ingest-india"
version = "0.1.0"
description = "NSE equities and stock futures from Upstox into ClickHouse v2."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-runtime",
    "factorlab-calendars",
    "factorlab-ingest",
    "factorlab-storage",
    "factorlab-orchestration",
    "factorlab-provider-upstox",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "requests>=2.32.3",
    "exchange-calendars>=4.5",
    "tzdata>=2024.1",   # zoneinfo keys on hosts without a system tz database
]

[project.scripts]
factorlab-ingest-india = "factorlab.components.ingest_india.cli:main"

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-runtime = { workspace = true }
factorlab-calendars = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-storage = { workspace = true }
factorlab-orchestration = { workspace = true }
factorlab-provider-upstox = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
