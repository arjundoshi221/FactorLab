version: 2
name: us_configured
provider: github_csv
daily_source: schwab
refresh_interval_minutes: 1440

indexes:
  - name: sp500
    minimum_constituents: 450

providers:
  github_csv:
    indexes:
      sp500:
        url: https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv
        symbol_column: Symbol
  eodhd:
    indexes:
      sp500:
        symbol: GSPC.INDX

extra_symbols: []
