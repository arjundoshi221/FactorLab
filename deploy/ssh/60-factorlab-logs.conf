# /etc/ssh/sshd_config.d/60-factorlab-logs.conf, installed by deploy/scripts/prepare-host.sh
# (which validates it with `sshd -t` and removes it again if the check fails).
#
# The factorlab-logs account can run exactly one program, the read-only log reader.
# It gets no TTY, no forwarding and no user rc. It cannot manage its own keys: they
# live in a root-owned file that the operator edits. The account's only group is
# factorlab-logs (no docker, no sudo). If the main sshd_config restricts logins with
# AllowUsers or AllowGroups, add factorlab-logs there as well.
Match User factorlab-logs
    AuthorizedKeysFile /etc/factorlab/log-reader/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/bin/factorlab-log-reader
    PermitTTY no
    DisableForwarding yes
    PermitTunnel no
    PermitUserRC no
    MaxSessions 2
Match all
