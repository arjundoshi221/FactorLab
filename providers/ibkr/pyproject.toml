[project]
name = "factorlab-provider-ibkr"
version = "0.1.0"
description = "Read-only Interactive Brokers account mirror."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-ingest",
    "pydantic>=2.5",
    "ib_async>=2.1",
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-ingest = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
