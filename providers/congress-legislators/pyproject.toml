[project]
name = "factorlab-provider-congress-legislators"
version = "0.1.0"
description = "Congress legislators and committees."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-ingest",
    "pydantic>=2.5",
    "requests>=2.32.3",
]

[tool.uv.sources]
factorlab-ingest = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
