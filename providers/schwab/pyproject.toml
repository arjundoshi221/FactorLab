[project]
name = "factorlab-provider-schwab"
version = "0.1.0"
description = "Charles Schwab US listings and bars."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-core",
    "factorlab-ingest",
    "factorlab-calendars",
    "pydantic>=2.5",
    "requests>=2.32.3",
]

[tool.uv.sources]
factorlab-core = { workspace = true }
factorlab-ingest = { workspace = true }
factorlab-calendars = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
