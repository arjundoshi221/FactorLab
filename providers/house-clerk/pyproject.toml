[project]
name = "factorlab-provider-house-clerk"
version = "0.1.0"
description = "US House financial-disclosure filings and trades."
requires-python = ">=3.12,<3.13"
dependencies = [
    "factorlab-ingest",
    "requests>=2.32.3",
    "pdfplumber>=0.11",
    "defusedxml>=0.7.1",
]

[tool.uv.sources]
factorlab-ingest = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# factorlab is a namespace: only this member's own package ships.
packages = ["src/factorlab"]
