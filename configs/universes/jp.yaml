# Japan (TSE) equity universe — symbol format: {TICKER}.T (4-digit numeric tickers)
# Built 2026-05-02; population via EODHD /exchange-symbol-list/TSE.
region: jp
source: eodhd
currency: JPY
exchange_calendar: XTKS   # Tokyo Stock Exchange calendar
default_universe: demo

exchanges:
  tse:
    calendar: XTKS
    trading_hours: "09:00-15:00"   # local; with lunch break 11:30-12:30
    timezone: "Asia/Tokyo"
    suffix: ".T"

# ── Universes ────────────────────────────────────────────────────────────────
universes:
  demo:
    symbols:
      - 7203.T          # Toyota Motor — also ADR TM
      - 6758.T          # Sony Group — also ADR SONY
      - 9984.T          # SoftBank Group
      - 6861.T          # Keyence
      - 7974.T          # Nintendo — also ADR NTDOY
  # File-based (future):
  # tse_topix500:
  #   source_file: data/jp/universes/topix500_latest.csv
  # tse_nikkei225:
  #   source_file: data/jp/universes/nikkei225_latest.csv
