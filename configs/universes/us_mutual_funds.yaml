# US registered mutual funds — symbol format: {TICKER} (typically 5-letter ending in X)
# Built 2026-05-02 to capture mutual-fund holdings surfaced in legislator PTRs.
#
# Distinct from us.yaml (US equities + ETFs):
#   - These are open-end mutual funds (Investment Company Act of 1940)
#   - Quarterly Form NPORT-P holdings filings → unmasks "is the senator long defense"
#     when their disclosed holding is a fund not a single ticker
#
# Master source: SEC EDGAR Form NPORT-P filings (free, official).
# NOT covered here: ETFs (those live in us.yaml — they file 13F not NPORT-P).
region: us
source: sec_edgar
currency: USD
default_universe: demo
filing_form: NPORT-P
filing_cadence: quarterly   # 60 days after each quarter end

# ── NPORT-P scraper config (future) ─────────────────────────────────────────
# Pulls quarterly holdings + portfolio metrics from SEC EDGAR.
nport:
  index_url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&type=NPORT-P&dateb=&owner=include&count=40"
  filing_url_pattern: "https://www.sec.gov/Archives/edgar/data/{cik}/{accession_no}/primary_doc.xml"
  # SEC EDGAR fair-access policy expects a UA that identifies the requester.
  # Code reads FACTORLAB_USER_AGENT from .env first; this YAML value is the
  # fallback. NEVER hardcode a personal email here.
  user_agent: "FactorLab/1.0"
  rate_limit_per_sec: 10                                  # SEC standard 10 req/sec

# ── Universes ────────────────────────────────────────────────────────────────
universes:
  demo:
    # Funds that surfaced in 2026-05-02 legislator PTR processing as 403s on
    # Finnhub /stock/usa-spending — confirming they're real mutual funds in
    # member portfolios. Listed here as the seed for NPORT-P scraping.
    symbols:
      - PRJAX           # T. Rowe Price Blue Chip Growth — Class A
      - PRNHX           # T. Rowe Price New Horizons
      - PRPFX           # Permanent Portfolio
      - SMCWX           # American Funds SMALLCAP World — Class F-1 (Lockheed-employee popular)
      - SGENX           # First Eagle Global
      - LMGEX           # ClearBridge Large Cap Growth — Class IS
      - VEVIX           # Vanguard FTSE Emerging Markets ETF (institutional)
      - TGBAX           # Templeton Global Bond — Class A
      - TOLLX           # Tortoise MLP & Pipeline
      - QLEIX           # AQR Long-Short Equity — Class I
  # Mutual funds surfaced from senate_efd_paper_llm vision extractions
  # (Boozman IRA holdings, 2026-05-03 extraction batch).
  senate_held:
    description: Mutual funds held by US senators (surfaced via paper-PTR LLM)
    symbols:
      - TOLLX           # Tortoise MLP & Pipeline (also in demo above; kept for clarity)
      - NMVAX           # Nuance Mid Cap Value
      - WHGSX           # Westwood SmallCap Institutional
      - DBLEX           # DoubleLine Emerging Markets Local Currency Bond — Class I
      - EMNCX           # VanEck Emerging Markets Bond Fund — Class C
      - PRSVX           # T. Rowe Price Small-Cap Value (placeholder; verify)
      # Westwood Small Cap Instl converted (1/26/21 + 1/29/21) into:
      # "Advisores Inner Circle Fund Westwood" — same advisor, no ticker change
      # documented here; matches the "Westwood Small Cap" pattern.
