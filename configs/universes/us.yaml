# US equity universes — symbol format: {TICKER}.{EXCHANGE}
region: us
source: eodhd
currency: USD
exchange_calendar: XNYS  # NYSE calendar key for exchange_calendars lib
default_universe: us_listed_equities

universes:
  us_listed_equities:
    selection: eodhd_active_common_stock
    exchanges: [NASDAQ, NYSE, NYSE_MKT]
    include_adrs: true
    exclude: [ETF, preferred_stock, warrant, unit, note, otc, derivative]
    daily_source: eodhd
    minute_source: schwab
    minute_tier: us_liquid_250
  us_liquid_250:
    parent: us_listed_equities
    size: 250
    ranking: median_dollar_volume_20_sessions
    minimum_observations: 15
    rebalance: weekly
  demo:
    symbols: [AAPL.US, TSLA.US, AMZN.US, VTI.US]
  mega_cap:
    symbols:
      - AAPL.US
      - MSFT.US
      - GOOGL.US
      - AMZN.US
      - NVDA.US
      - META.US
      - BRK-B.US
      - JPM.US
      - JNJ.US
      - V.US
  # ETFs surfaced via legislator paper-PTR vision extractions (2026-05-03).
  # Entries here are funds Senator Boozman (and likely others) hold in IRA
  # accounts; tracking them lets us decompose senator-flow into broad
  # asset-class signals (treasuries, REITs, commodities, intl equity).
  # Source: senate_efd_paper_llm endpoint extractions.
  senate_held_etfs:
    description: ETFs held by US senators (surfaced via paper-PTR LLM extraction)
    symbols:
      - SPY.US      # S&P 500
      - QQQ.US      # Nasdaq 100
      - IVV.US      # iShares S&P 500
      - IVW.US      # iShares S&P 500 Growth
      - IWM.US      # iShares Russell 2000
      - EFA.US      # iShares MSCI EAFE
      - INDA.US     # iShares MSCI India
      - GEM.US      # GS ActiveBeta Emerging Markets
      - SCHP.US     # Schwab US TIPS
      - IEF.US      # iShares 7-10 Year Treasury
      - MBB.US      # iShares MBS
      - CMBS.US     # iShares CMBS
      - GBIL.US     # GS Treasury Access (T-bills)
      - VNQ.US      # Vanguard REIT
      - VEA.US      # Vanguard FTSE Developed
      - SLV.US      # iShares Silver Trust
      - GLD.US      # SPDR Gold (commonly seen, included for completeness)
      - MDY.US      # SPDR S&P 400 Midcap
      - EMLP.US     # First Trust North American Energy Infrastructure
      - FEUZ.US     # First Trust Eurozone AlphaDEX
      - NFRA.US     # FlexShares STOXX Global Infrastructure
  # File-based universes (built by scripts/build_universe.py):
  # russell3000:
  #   source_file: data/us/universes/russell3000_latest.csv
  # us_common_stocks:
  #   source_file: data/us/universes/us_common_stocks_latest.csv
