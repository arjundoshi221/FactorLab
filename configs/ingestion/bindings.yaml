# Which provider instance feeds which dataset (docs/architecture/07 §9.2).
#
#   role: primary | secondary | shadow | disabled
#     primary    writes, is read by *_best, and is the only role that may mint identity
#     secondary  writes, read by *_best where primary has no row
#     shadow     writes its own rows but is never read; resolves identity, never mints
#     disabled   kept for reference, not run
#   priority: lower wins in *_best (synced to ref.source_priorities in P7)
#
# Switching provider = change roles here. Adding one = a new sources/<p>/ package
# plus a binding (start it as shadow). See 07 §12 for the recipes.
#
# India collectors use these primary bindings through the production scheduler.
version: 1
bindings:
  - {dataset: ref.listings, market: IND, provider: upstox, role: primary, priority: 10}
  - {dataset: ref.contracts, market: IND, provider: upstox, role: primary, priority: 10}
  - dataset: market.bars
    market: IND
    resolution: 1min
    provider: upstox
    role: primary
    priority: 10
    params: {universe: full_nse_eq, mode: quote}
  - dataset: market.futures_contract_bars
    market: IND
    resolution: 1min
    provider: upstox
    role: primary
    priority: 10
    params: {mode: candles}

  # US references and prices use Schwab. Alternate EODHD feeds remain shadow.
  - {dataset: ref.listings, market: USA, provider: eodhd, role: shadow, priority: 10}   # -> primary
  - {dataset: ref.listings, market: USA, provider: schwab, role: primary, priority: 20}
  - {dataset: market.bars, market: USA, resolution: daily, provider: schwab, role: primary, priority: 10}
  - dataset: market.bars      # -> secondary
    market: USA
    resolution: daily
    provider: eodhd
    role: shadow
    priority: 20
    params: {mode: bulk}
  - {dataset: market.bars, market: USA, resolution: 1min, provider: schwab, role: primary, priority: 10}
  # Membership authority is explicitly selected in the mounted US universe config.
  - {dataset: ref.universe_membership, market: USA, provider: github_csv, role: primary, priority: 10}
  - {dataset: ref.universe_membership, market: USA, provider: eodhd, role: shadow, priority: 20}
  # Broker mirror (P6). broker.* tables have no `source` in their keys, so this
  # shadow fetches, archives and normalizes but writes nothing; the production
  # job is scripts/us/ibkr/us_portfolio_ibkr_snapshot.py (IBKRBrokerProvider).
  - {dataset: broker.snapshot, market: USA, provider: ibkr, role: shadow, params: {modes: [paper, live]}}  # -> primary
  # Political bootstrap runs these datasets in dependency order through the engine.
  - {dataset: ref.legislators, market: USA, provider: congress_legislators, role: primary}
  - {dataset: alt.political_filings, market: USA, provider: house_clerk, role: primary}
  - {dataset: alt.political_trades, market: USA, provider: house_clerk, role: primary}
  # Fundamentals (P8). New dataset; no production writer exists yet.
  - {dataset: fundamentals.filings, market: USA, provider: edgar, role: shadow}   # -> primary
